<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/time-stack/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />

    <!-- iOS PWA: ホーム画面追加で全画面起動 + 黒ステータスバー -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="time-stack" />
    <link rel="apple-touch-icon" href="/time-stack/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <meta name="color-scheme" content="dark" />

    <title>time-stack — 時の経過を平面グリッドで体感する Canvas 2D ビジュアライザ</title>
    <meta
      name="description"
      content="1 分 / 1 時間 / 1 日 を 60/60/24 マスのグリッドで可視化、ズーム遷移で時間の階層を直感的に体験する Canvas 2D 時間ビジュアライザ。"
    />
    <meta name="author" content="mm-1989" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="time-stack — 時の経過を平面グリッドで体感する" />
    <meta
      property="og:description"
      content="1 分 / 1 時間 / 1 日 を切り替え、進行中マスが画面中央へズームインする時間ビジュアライザ。"
    />
    <meta property="og:image" content="https://mm-1989.github.io/time-stack/og.svg" />
    <meta property="og:url" content="https://mm-1989.github.io/time-stack/" />
    <meta property="og:site_name" content="time-stack" />
    <meta property="og:locale" content="ja_JP" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="time-stack — 時の経過を平面グリッドで体感する" />
    <meta
      name="twitter:description"
      content="1 分 / 1 時間 / 1 日 を切り替え、進行中マスが画面中央へズームインする時間ビジュアライザ。"
    />
    <meta name="twitter:image" content="https://mm-1989.github.io/time-stack/og.svg" />
  </head>
  <body>
    <div id="app"></div>
    <!-- TRON UI 装飾: 画面四隅の L 字マーク -->
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>
    <!-- 起動 INIT オーバーレイ (1.4s で自動 fade) -->
    <div id="init-overlay" class="init-overlay">&gt;&nbsp;INITIALIZING TIME GRID</div>
    <!-- freeze 時の PAUSED オーバーレイ (Space で toggle) -->
    <div id="paused-overlay" class="paused-overlay">&gt;&nbsp;SYSTEM PAUSED</div>
    <!-- フッター: バージョン + ソース -->
    <a class="footer-info" href="https://github.com/mm-1989/time-stack" target="_blank" rel="noopener">v1.0 · time-stack</a>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
