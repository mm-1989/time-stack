name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          GITHUB_SHA: ${{ github.sha }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  capture:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main (for capture script)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # 音声 (WAV) キャプチャを走らせるか判定:
      #   - workflow_dispatch (手動実行) は常に走らせる
      #   - コミットメッセージに [audio] タグがあれば走らせる
      #   - 直前 commit で src/audio.ts が変更されていれば走らせる
      #   - それ以外は skip (WAV 録音は重いので毎回回さない)
      - name: Detect audio capture trigger
        id: audio_trigger
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "capture=1" >> $GITHUB_OUTPUT
            echo "reason=manual" >> $GITHUB_OUTPUT
          elif git log -1 --format=%B HEAD | grep -qE '\[audio\]'; then
            echo "capture=1" >> $GITHUB_OUTPUT
            echo "reason=tag" >> $GITHUB_OUTPUT
          elif git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -qE '^src/audio\.ts$'; then
            echo "capture=1" >> $GITHUB_OUTPUT
            echo "reason=audio_changed" >> $GITHUB_OUTPUT
          else
            echo "capture=0" >> $GITHUB_OUTPUT
            echo "reason=skip" >> $GITHUB_OUTPUT
          fi

      - name: Capture screenshots (and audio if triggered)
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
          OUT_DIR: ./capture-out
          CAPTURE_AUDIO: ${{ steps.audio_trigger.outputs.capture }}
          CAPTURE_AUDIO_REASON: ${{ steps.audio_trigger.outputs.reason }}
        run: node scripts/capture.mjs

      - name: Force push screenshots to orphan branch (always 1 commit)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # 撮影結果のみを含む新規 git リポジトリを作って force push する。
          # こうすることで screenshots ブランチは常に「最新 1 commit」だけになり、
          # 履歴肥大なく、ローカル worktree からも `git fetch + reset --hard` で取り込める。
          WORK=/tmp/sshot-out
          mkdir -p "$WORK"
          cp ./capture-out/*.png "$WORK/"
          cp ./capture-out/*.wav "$WORK/" 2>/dev/null || true
          cp ./capture-out/*.log "$WORK/" 2>/dev/null || true

          cd "$WORK"
          git init -q
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "screenshots @ ${{ github.sha }}"
          git branch -M screenshots
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" \
            screenshots
