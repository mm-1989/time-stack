<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#020812"/>
      <stop offset="0.6" stop-color="#000000"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#00f5ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#00f5ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 背景アンビエントグリッド (32px 間隔の cyan 細線) -->
  <g stroke="#00f5ff" stroke-width="0.6" opacity="0.10">
    <!-- 縦線 -->
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630" opacity="0.16"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <!-- 横線 -->
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300" opacity="0.16"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
  </g>

  <!-- 4 隅 L 字コーナーマーク -->
  <g stroke="#00f5ff" stroke-width="1" opacity="0.45" fill="none">
    <path d="M 20 44 L 20 20 L 44 20"/>
    <path d="M 1156 20 L 1180 20 L 1180 44"/>
    <path d="M 20 586 L 20 610 L 44 610"/>
    <path d="M 1180 586 L 1180 610 L 1156 610"/>
  </g>

  <!-- 上部スケール切替バッジ -->
  <g transform="translate(600 50)">
    <rect x="-150" y="-18" width="300" height="36" rx="2"
          fill="rgba(0,0,0,0.6)" stroke="#00f5ff" stroke-opacity="0.18"/>
    <g font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" letter-spacing="2">
      <g transform="translate(-90 0)">
        <circle cx="-12" cy="0" r="3" fill="#00f5ff" opacity="0.5"/>
        <text x="-2" y="3" fill="#5a7388">SEC</text>
      </g>
      <g transform="translate(0 0)">
        <rect x="-46" y="-13" width="92" height="26" rx="2"
              fill="rgba(0,245,255,0.08)" stroke="#00f5ff" stroke-opacity="0.45"/>
        <circle cx="-32" cy="0" r="3" fill="#4ad8ff"/>
        <text x="-22" y="3" fill="#e6f6ff">MIN</text>
      </g>
      <g transform="translate(94 0)">
        <circle cx="-14" cy="0" r="3" fill="#ff7a00" opacity="0.5"/>
        <text x="-4" y="3" fill="#5a7388">HOUR</text>
      </g>
    </g>
  </g>

  <!-- 中央グリッド本体 (12 cols × 5 rows = 60 マス、TRON ワイヤーフレーム) -->
  <ellipse cx="600" cy="350" rx="500" ry="220" fill="url(#centerGlow)"/>
  <g transform="translate(180 170)">
    <!-- マス: 70x42, gap 8 -->
    <!-- 35 マス塗 (cyan 強線) + 36 マス目進行中 (boost + 粒子) + 残り未塗 (薄線) -->

    <!-- row 0 (0..11) - 全 12 マス塗 -->
    <g fill="rgba(0,245,255,0.10)" stroke="#00f5ff" stroke-width="1.3" stroke-opacity="0.85" filter="drop-shadow(0 0 4px #00f5ff)">
      <rect x="0"   y="0"  width="70" height="42" rx="2"/>
      <rect x="78"  y="0"  width="70" height="42" rx="2"/>
      <rect x="156" y="0"  width="70" height="42" rx="2"/>
      <rect x="234" y="0"  width="70" height="42" rx="2"/>
      <rect x="312" y="0"  width="70" height="42" rx="2"/>
      <rect x="390" y="0"  width="70" height="42" rx="2"/>
      <rect x="468" y="0"  width="70" height="42" rx="2"/>
      <rect x="546" y="0"  width="70" height="42" rx="2"/>
      <rect x="624" y="0"  width="70" height="42" rx="2"/>
      <rect x="702" y="0"  width="70" height="42" rx="2"/>
      <rect x="780" y="0"  width="70" height="42" rx="2"/>
      <rect x="858" y="0"  width="70" height="42" rx="2"/>
    </g>
    <!-- row 1 (12..23) - 全 12 マス塗 -->
    <g fill="rgba(0,245,255,0.10)" stroke="#00f5ff" stroke-width="1.3" stroke-opacity="0.85" filter="drop-shadow(0 0 4px #00f5ff)" transform="translate(0 50)">
      <rect x="0"   y="0"  width="70" height="42" rx="2"/>
      <rect x="78"  y="0"  width="70" height="42" rx="2"/>
      <rect x="156" y="0"  width="70" height="42" rx="2"/>
      <rect x="234" y="0"  width="70" height="42" rx="2"/>
      <rect x="312" y="0"  width="70" height="42" rx="2"/>
      <rect x="390" y="0"  width="70" height="42" rx="2"/>
      <rect x="468" y="0"  width="70" height="42" rx="2"/>
      <rect x="546" y="0"  width="70" height="42" rx="2"/>
      <rect x="624" y="0"  width="70" height="42" rx="2"/>
      <rect x="702" y="0"  width="70" height="42" rx="2"/>
      <rect x="780" y="0"  width="70" height="42" rx="2"/>
      <rect x="858" y="0"  width="70" height="42" rx="2"/>
    </g>
    <!-- row 2 (24..35) - 0..10 塗、11=進行中 (boost + 粒子) -->
    <g transform="translate(0 100)">
      <g fill="rgba(0,245,255,0.10)" stroke="#00f5ff" stroke-width="1.3" stroke-opacity="0.85" filter="drop-shadow(0 0 4px #00f5ff)">
        <rect x="0"   y="0"  width="70" height="42" rx="2"/>
        <rect x="78"  y="0"  width="70" height="42" rx="2"/>
        <rect x="156" y="0"  width="70" height="42" rx="2"/>
        <rect x="234" y="0"  width="70" height="42" rx="2"/>
        <rect x="312" y="0"  width="70" height="42" rx="2"/>
        <rect x="390" y="0"  width="70" height="42" rx="2"/>
        <rect x="468" y="0"  width="70" height="42" rx="2"/>
        <rect x="546" y="0"  width="70" height="42" rx="2"/>
        <rect x="624" y="0"  width="70" height="42" rx="2"/>
        <rect x="702" y="0"  width="70" height="42" rx="2"/>
        <rect x="780" y="0"  width="70" height="42" rx="2"/>
      </g>
      <!-- 進行中マス (boost で 1.22 倍、粒子 + 強発光) -->
      <g transform="translate(854 -4)">
        <rect x="0" y="0" width="86" height="51" rx="2"
              fill="rgba(0,245,255,0.06)" stroke="#00f5ff" stroke-width="1.5"
              filter="drop-shadow(0 0 12px #00f5ff)"/>
        <text x="43" y="74" fill="#fff" font-size="14" font-weight="700"
              font-family="'JetBrains Mono', monospace" text-anchor="middle"
              letter-spacing="0.5"
              filter="drop-shadow(0 0 4px rgba(0,0,0,0.8))">35M</text>
      </g>
    </g>
    <!-- row 3-4 未塗 (薄い枠線のみ) -->
    <g fill="rgba(0,245,255,0.02)" stroke="#00f5ff" stroke-width="1" stroke-opacity="0.20" transform="translate(0 150)">
      <rect x="0" y="0" width="70" height="42" rx="2"/>
      <rect x="78" y="0" width="70" height="42" rx="2"/>
      <rect x="156" y="0" width="70" height="42" rx="2"/>
      <rect x="234" y="0" width="70" height="42" rx="2"/>
      <rect x="312" y="0" width="70" height="42" rx="2"/>
      <rect x="390" y="0" width="70" height="42" rx="2"/>
      <rect x="468" y="0" width="70" height="42" rx="2"/>
      <rect x="546" y="0" width="70" height="42" rx="2"/>
      <rect x="624" y="0" width="70" height="42" rx="2"/>
      <rect x="702" y="0" width="70" height="42" rx="2"/>
      <rect x="780" y="0" width="70" height="42" rx="2"/>
      <rect x="858" y="0" width="70" height="42" rx="2"/>
    </g>
    <g fill="rgba(0,245,255,0.02)" stroke="#00f5ff" stroke-width="1" stroke-opacity="0.20" transform="translate(0 200)">
      <rect x="0" y="0" width="70" height="42" rx="2"/>
      <rect x="78" y="0" width="70" height="42" rx="2"/>
      <rect x="156" y="0" width="70" height="42" rx="2"/>
      <rect x="234" y="0" width="70" height="42" rx="2"/>
      <rect x="312" y="0" width="70" height="42" rx="2"/>
      <rect x="390" y="0" width="70" height="42" rx="2"/>
      <rect x="468" y="0" width="70" height="42" rx="2"/>
      <rect x="546" y="0" width="70" height="42" rx="2"/>
      <rect x="624" y="0" width="70" height="42" rx="2"/>
      <rect x="702" y="0" width="70" height="42" rx="2"/>
      <rect x="780" y="0" width="70" height="42" rx="2"/>
      <rect x="858" y="0" width="70" height="42" rx="2"/>
    </g>
  </g>

  <!-- 下部 title + tagline -->
  <g transform="translate(600 540)" font-family="'Space Grotesk', sans-serif" text-anchor="middle">
    <text x="0" y="0" fill="#00f5ff" font-size="38" font-weight="600" letter-spacing="3"
          filter="drop-shadow(0 0 10px rgba(0,245,255,0.5))">time-stack</text>
    <text x="0" y="32" fill="#5a7388" font-size="13" font-weight="400" letter-spacing="4"
          font-family="'JetBrains Mono', monospace">A SPATIAL TIME VISUALIZER</text>
  </g>
</svg>
