<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e1c"/>
      <stop offset="1" stop-color="#02030a"/>
    </linearGradient>
    <linearGradient id="grainHour" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2c879"/>
      <stop offset="1" stop-color="#b48b5a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2c879" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#f2c879" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 上部: スケール切替バッジ -->
  <g transform="translate(600 60)">
    <rect x="-160" y="-20" width="320" height="40" rx="20"
          fill="rgba(8,12,22,0.55)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <g font-family="ui-monospace, monospace" font-size="13" font-weight="500" letter-spacing="0.06em">
      <g transform="translate(-100 0)">
        <circle cx="-16" cy="0" r="4" fill="#fff5d0" opacity="0.55"/>
        <text x="-6" y="4" fill="#7a8398">1 min</text>
      </g>
      <g transform="translate(0 0)">
        <rect x="-46" y="-14" width="92" height="28" rx="14" fill="rgba(255,255,255,0.08)"/>
        <circle cx="-30" cy="0" r="4" fill="#f2c879"/>
        <text x="-20" y="4" fill="#f1f4fa">1 hour</text>
      </g>
      <g transform="translate(100 0)">
        <circle cx="-14" cy="0" r="4" fill="#b48b5a" opacity="0.55"/>
        <text x="-4" y="4" fill="#7a8398">1 day</text>
      </g>
    </g>
  </g>

  <!-- 中央: グリッド (1 hour モードを描画。10 cols × 6 rows = 60 マス) -->
  <g transform="translate(160 145)">
    <!-- グリッド背景の glow -->
    <ellipse cx="440" cy="180" rx="380" ry="220" fill="url(#glow)" opacity="0.4"/>

    <!-- 60 マスを cols=10, rows=6 で配置。各マス 72×46、gap 8 -->
    <g>
      <!-- 38 マス塗り済み + 39 マス目進行中 + 残り未塗の構成 -->
    </g>
  </g>

  <!-- グリッド本体 (script で生成しにくいので手書き) -->
  <g transform="translate(160 160)">
    <!-- 38 cells filled (rows 0-3 + row 4 cells 0-7) -->
    <!-- row 0: 0..9 -->
    <g>
      <rect x="0"   y="0"   width="72" height="46" rx="8" fill="url(#grainHour)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
      <rect x="80"  y="0"   width="72" height="46" rx="8" fill="url(#grainHour)" stroke="rgba(255,255,255,0.18)"/>
      <rect x="160" y="0"   width="72" height="46" rx="8" fill="url(#grainHour)" stroke="rgba(255,255,255,0.18)"/>
      <rect x="240" y="0"   width="72" height="46" rx="8" fill="url(#grainHour)" stroke="rgba(255,255,255,0.18)"/>
      <rect x="320" y="0"   width="72" height="46" rx="8" fill="url(#grainHour)" stroke="rgba(255,255,255,0.18)"/>
      <rect x="400" y="0"   width="72" height="46" rx="8" fill="url(#grainHour)" stroke="rgba(255,255,255,0.18)"/>
      <rect x="480" y="0"   width="72" height="46" rx="8" fill="url(#grainHour)" stroke="rgba(255,255,255,0.18)"/>
      <rect x="560" y="0"   width="72" height="46" rx="8" fill="url(#grainHour)" stroke="rgba(255,255,255,0.18)"/>
      <rect x="640" y="0"   width="72" height="46" rx="8" fill="url(#grainHour)" stroke="rgba(255,255,255,0.18)"/>
      <rect x="720" y="0"   width="72" height="46" rx="8" fill="url(#grainHour)" stroke="rgba(255,255,255,0.18)"/>
    </g>
    <!-- row 1 -->
    <g transform="translate(0 54)">
      <rect x="0"   y="0"   width="72" height="46" rx="8" fill="url(#grainHour)" stroke="rgba(255,255,255,0.18)"/>
      <rect x="80"  y="0"   width="72" height="46" rx="8" fill="url(#grainHour)" stroke="rgba(255,255,255,0.18)"/>
      <rect x="160" y="0"   width="72" height="46" rx="8" fill="url(#grainHour)" stroke="rgba(255,255,255,0.18)"/>
      <rect x="240" y="0"   width="72" height="46" rx="8" fill="url(#grainHour)" stroke="rgba(255,255,255,0.18)"/>
      <rect x="320" y="0"   width="72" height="46" rx="8" fill="url(#grainHour)" stroke="rgba(255,255,255,0.18)"/>
      <rect x="400" y="0"   width="72" height="46" rx="8" fill="url(#grainHour)" stroke="rgba(255,255,255,0.18)"/>
      <rect x="480" y="0"   width="72" height="46" rx="8" fill="url(#grainHour)" stroke="rgba(255,255,255,0.18)"/>
      <rect x="560" y="0"   width="72" height="46" rx="8" fill="url(#grainHour)" stroke="rgba(255,255,255,0.18)"/>
      <!-- 18 番目 = row 1 col 8 を進行中マスにする (粒子表示) -->
      <g transform="translate(640 0)">
        <rect x="0" y="0" width="72" height="46" rx="8" fill="rgba(242,200,121,0.05)"
              stroke="#f2c879" stroke-width="1.2" filter="url(#cellGlow)"/>
        <!-- 進行中マスの内部粒子 (12 cols × 5 rows = 60 個、約 35 個点灯) -->
        <g transform="translate(8 6)">
          <!-- row 0: 12 個全部点灯 -->
          <g fill="#f2c879">
            <circle cx="2" cy="2" r="1.6"/><circle cx="7" cy="2" r="1.6"/>
            <circle cx="12" cy="2" r="1.6"/><circle cx="17" cy="2" r="1.6"/>
            <circle cx="22" cy="2" r="1.6"/><circle cx="27" cy="2" r="1.6"/>
            <circle cx="32" cy="2" r="1.6"/><circle cx="37" cy="2" r="1.6"/>
            <circle cx="42" cy="2" r="1.6"/><circle cx="47" cy="2" r="1.6"/>
            <circle cx="52" cy="2" r="1.6"/><circle cx="57" cy="2" r="1.6"/>
          </g>
          <!-- row 1 -->
          <g fill="#f2c879" transform="translate(0 7)">
            <circle cx="2" cy="2" r="1.6"/><circle cx="7" cy="2" r="1.6"/>
            <circle cx="12" cy="2" r="1.6"/><circle cx="17" cy="2" r="1.6"/>
            <circle cx="22" cy="2" r="1.6"/><circle cx="27" cy="2" r="1.6"/>
            <circle cx="32" cy="2" r="1.6"/><circle cx="37" cy="2" r="1.6"/>
            <circle cx="42" cy="2" r="1.6"/><circle cx="47" cy="2" r="1.6"/>
            <circle cx="52" cy="2" r="1.6"/><circle cx="57" cy="2" r="1.6"/>
          </g>
          <!-- row 2 -->
          <g fill="#f2c879" transform="translate(0 14)">
            <circle cx="2" cy="2" r="1.6"/><circle cx="7" cy="2" r="1.6"/>
            <circle cx="12" cy="2" r="1.6"/><circle cx="17" cy="2" r="1.6"/>
            <circle cx="22" cy="2" r="1.6"/><circle cx="27" cy="2" r="1.6"/>
            <circle cx="32" cy="2" r="1.6"/><circle cx="37" cy="2" r="1.6"/>
            <circle cx="42" cy="2" r="1.6"/><circle cx="47" cy="2" r="1.6"/>
            <circle cx="52" cy="2" r="1.6"/>
            <!-- 12 番目: 進行中粒子 (脈動感) -->
            <circle cx="57" cy="2" r="2" opacity="0.85"/>
          </g>
          <!-- row 3-4: 未点灯 -->
          <g fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="0.5" transform="translate(0 21)">
            <circle cx="2" cy="2" r="1.4"/><circle cx="7" cy="2" r="1.4"/>
            <circle cx="12" cy="2" r="1.4"/><circle cx="17" cy="2" r="1.4"/>
            <circle cx="22" cy="2" r="1.4"/><circle cx="27" cy="2" r="1.4"/>
            <circle cx="32" cy="2" r="1.4"/><circle cx="37" cy="2" r="1.4"/>
            <circle cx="42" cy="2" r="1.4"/><circle cx="47" cy="2" r="1.4"/>
            <circle cx="52" cy="2" r="1.4"/><circle cx="57" cy="2" r="1.4"/>
          </g>
          <g fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="0.5" transform="translate(0 28)">
            <circle cx="2" cy="2" r="1.4"/><circle cx="7" cy="2" r="1.4"/>
            <circle cx="12" cy="2" r="1.4"/><circle cx="17" cy="2" r="1.4"/>
            <circle cx="22" cy="2" r="1.4"/><circle cx="27" cy="2" r="1.4"/>
            <circle cx="32" cy="2" r="1.4"/><circle cx="37" cy="2" r="1.4"/>
            <circle cx="42" cy="2" r="1.4"/><circle cx="47" cy="2" r="1.4"/>
            <circle cx="52" cy="2" r="1.4"/><circle cx="57" cy="2" r="1.4"/>
          </g>
        </g>
      </g>
      <rect x="720" y="0"   width="72" height="46" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)"/>
    </g>
    <!-- row 2-5 未塗 -->
    <g fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1">
      <g transform="translate(0 108)">
        <rect x="0" width="72" height="46" rx="8"/><rect x="80" width="72" height="46" rx="8"/>
        <rect x="160" width="72" height="46" rx="8"/><rect x="240" width="72" height="46" rx="8"/>
        <rect x="320" width="72" height="46" rx="8"/><rect x="400" width="72" height="46" rx="8"/>
        <rect x="480" width="72" height="46" rx="8"/><rect x="560" width="72" height="46" rx="8"/>
        <rect x="640" width="72" height="46" rx="8"/><rect x="720" width="72" height="46" rx="8"/>
      </g>
      <g transform="translate(0 162)">
        <rect x="0" width="72" height="46" rx="8"/><rect x="80" width="72" height="46" rx="8"/>
        <rect x="160" width="72" height="46" rx="8"/><rect x="240" width="72" height="46" rx="8"/>
        <rect x="320" width="72" height="46" rx="8"/><rect x="400" width="72" height="46" rx="8"/>
        <rect x="480" width="72" height="46" rx="8"/><rect x="560" width="72" height="46" rx="8"/>
        <rect x="640" width="72" height="46" rx="8"/><rect x="720" width="72" height="46" rx="8"/>
      </g>
      <g transform="translate(0 216)">
        <rect x="0" width="72" height="46" rx="8"/><rect x="80" width="72" height="46" rx="8"/>
        <rect x="160" width="72" height="46" rx="8"/><rect x="240" width="72" height="46" rx="8"/>
        <rect x="320" width="72" height="46" rx="8"/><rect x="400" width="72" height="46" rx="8"/>
        <rect x="480" width="72" height="46" rx="8"/><rect x="560" width="72" height="46" rx="8"/>
        <rect x="640" width="72" height="46" rx="8"/><rect x="720" width="72" height="46" rx="8"/>
      </g>
      <g transform="translate(0 270)">
        <rect x="0" width="72" height="46" rx="8"/><rect x="80" width="72" height="46" rx="8"/>
        <rect x="160" width="72" height="46" rx="8"/><rect x="240" width="72" height="46" rx="8"/>
        <rect x="320" width="72" height="46" rx="8"/><rect x="400" width="72" height="46" rx="8"/>
        <rect x="480" width="72" height="46" rx="8"/><rect x="560" width="72" height="46" rx="8"/>
        <rect x="640" width="72" height="46" rx="8"/><rect x="720" width="72" height="46" rx="8"/>
      </g>
    </g>
  </g>

  <!-- 下部: title + tagline + 進捗バー -->
  <g transform="translate(600 540)" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">
    <text x="0" y="0" fill="#f1f4fa" font-size="42" font-weight="600" letter-spacing="2">time-stack</text>
    <text x="0" y="32" fill="#7a8398" font-size="14" letter-spacing="3" text-transform="uppercase">A Spatial Time Visualizer</text>
  </g>

  <!-- 進捗バー (下部、グリッドの下) -->
  <g transform="translate(160 510)">
    <rect x="0" y="0" width="800" height="2" fill="rgba(255,255,255,0.05)"/>
    <rect x="0" y="0" width="500" height="2" fill="#f2c879"/>
  </g>
</svg>
