<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0" stop-color="#2a3658"/>
      <stop offset="0.55" stop-color="#0e1428"/>
      <stop offset="1" stop-color="#02030a"/>
    </radialGradient>
    <linearGradient id="grainSec" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff5d0"/>
      <stop offset="1" stop-color="#fff0b0"/>
    </linearGradient>
    <linearGradient id="grainHour" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2c879"/>
      <stop offset="1" stop-color="#b48b5a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff5d0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff5d0" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 環境ダスト (静止のため小さい点を散らす) -->
  <g opacity="0.55" fill="#ffe8c0">
    <circle cx="120" cy="80" r="1.5"/>
    <circle cx="220" cy="180" r="1.2"/>
    <circle cx="80" cy="320" r="1.8"/>
    <circle cx="180" cy="480" r="1.3"/>
    <circle cx="320" cy="120" r="1.4"/>
    <circle cx="60" cy="200" r="1"/>
    <circle cx="380" cy="380" r="1.5"/>
    <circle cx="950" cy="100" r="1.6"/>
    <circle cx="1080" cy="220" r="1.2"/>
    <circle cx="880" cy="400" r="1.4"/>
    <circle cx="1130" cy="500" r="1.5"/>
    <circle cx="980" cy="540" r="1"/>
    <circle cx="1050" cy="350" r="1.3"/>
    <circle cx="900" cy="280" r="1.1"/>
  </g>

  <!-- 中央の砂時計 (位置 cx=460, cy=315 を中心に高さ ~440) -->
  <g transform="translate(460 95)">
    <!-- 中央発光 (背景の bloom) -->
    <ellipse cx="0" cy="220" rx="240" ry="240" fill="url(#glow)" filter="url(#blur)"/>

    <!-- ガラス殻 (砂時計のシルエット) -->
    <path d="
      M -180 -10 L 180 -10
      L 196 0 L 196 10
      L 192 16
      C 188 100 12 180 8 220
      C 12 260 188 340 192 424
      L 196 430 L 196 440
      L 180 450 L -180 450
      L -196 440 L -196 430 L -192 424
      C -188 340 -12 260 -8 220
      C -12 180 -188 100 -192 16
      L -196 10 L -196 0 Z
    " fill="rgba(180, 200, 230, 0.10)" stroke="rgba(154, 172, 204, 0.6)" stroke-width="2"/>

    <!-- フレーム (上端 / 腰 / 下端) -->
    <ellipse cx="0" cy="-2" rx="184" ry="14" fill="#9aaccc" opacity="0.85"/>
    <ellipse cx="0" cy="220" rx="14" ry="6" fill="#9aaccc" opacity="0.95"/>
    <ellipse cx="0" cy="442" rx="184" ry="14" fill="#9aaccc" opacity="0.85"/>

    <!-- 上半 (落下中の砂、中身は分・時の混合) -->
    <g opacity="0.95">
      <ellipse cx="0" cy="60" rx="160" ry="16" fill="url(#grainHour)"/>
      <ellipse cx="0" cy="90" rx="130" ry="14" fill="url(#grainHour)"/>
      <ellipse cx="0" cy="120" rx="100" ry="12" fill="url(#grainSec)"/>
      <ellipse cx="0" cy="150" rx="68" ry="10" fill="url(#grainSec)"/>
      <ellipse cx="0" cy="180" rx="36" ry="8" fill="#fff5d0"/>
    </g>

    <!-- 落下流 (中央に細い光) -->
    <rect x="-3" y="200" width="6" height="40" fill="#fff5d0" opacity="0.9"/>
    <rect x="-1.5" y="200" width="3" height="40" fill="#ffffff" opacity="0.95"/>

    <!-- 下半 (積もり中の砂) -->
    <g opacity="0.95">
      <ellipse cx="0" cy="260" rx="36" ry="8" fill="#fff5d0"/>
      <ellipse cx="0" cy="290" rx="68" ry="10" fill="url(#grainSec)"/>
      <ellipse cx="0" cy="320" rx="100" ry="12" fill="url(#grainSec)"/>
      <ellipse cx="0" cy="350" rx="130" ry="14" fill="url(#grainHour)"/>
      <ellipse cx="0" cy="380" rx="160" ry="16" fill="url(#grainHour)"/>
    </g>

    <!-- 中央 hot spot -->
    <circle cx="0" cy="220" r="14" fill="#fff5d0" opacity="0.85"/>
    <circle cx="0" cy="220" r="6" fill="#ffffff"/>
  </g>

  <!-- 右側のテキスト -->
  <g transform="translate(820 230)" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
    <text x="0" y="0" fill="#f1f4fa" font-size="68" font-weight="600" letter-spacing="2">time-stack</text>
    <text x="0" y="42" fill="#7a8398" font-size="20" font-weight="400" letter-spacing="3.5" text-transform="uppercase">A LIVING HOURGLASS</text>
    <g transform="translate(0 110)" font-family="'Inter', system-ui, sans-serif">
      <text x="0" y="0" fill="#c0c8d8" font-size="22" font-weight="400">経過時間を 3 シェルの粒で可視化する</text>
      <text x="0" y="32" fill="#c0c8d8" font-size="22" font-weight="400">時間体感ビジュアライザ。</text>
      <text x="0" y="80" fill="#8a93a8" font-size="18" font-weight="400">Three.js · WebGL · Real-time</text>
    </g>

    <!-- 凡例 -->
    <g transform="translate(0 270)" font-family="ui-monospace, monospace" font-size="16" letter-spacing="1.5">
      <circle cx="8" cy="-5" r="6" fill="#fff5d0"/>
      <text x="22" y="0" fill="#99a3b8">秒</text>
      <circle cx="80" cy="-5" r="6" fill="#b48b5a"/>
      <text x="94" y="0" fill="#99a3b8">分</text>
      <circle cx="152" cy="-5" r="6" fill="#f2c879"/>
      <text x="166" y="0" fill="#99a3b8">時</text>
      <text x="220" y="0" fill="#5a6378">│  1日で反転</text>
    </g>
  </g>
</svg>
