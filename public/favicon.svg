  <!-- 落下流 -->
  <rect x="31.4" y="25" width="1.2" height="14" fill="#fff5d0" opacity="0.95"/>
  <!-- 下の砂 (積もり) -->
  <path d="M24 50 L40 50 L38 42 C36 40 28 40 26 42 Z" fill="url(#grain)" opacity="0.95"/>
