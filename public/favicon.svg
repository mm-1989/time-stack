<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#1a2845"/>
      <stop offset="1" stop-color="#06080f"/>
    </radialGradient>
    <linearGradient id="grain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff5d0"/>
      <stop offset="0.5" stop-color="#f2c879"/>
      <stop offset="1" stop-color="#b48b5a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- 砂時計シルエット -->
  <path d="M20 12 L44 12 L44 14 L40 14 C40 22 32 28 32 32 C32 36 40 42 40 50 L44 50 L44 52 L20 52 L20 50 L24 50 C24 42 32 36 32 32 C32 28 24 22 24 14 L20 14 Z"
