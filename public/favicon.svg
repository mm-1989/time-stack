<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#1a2236"/>
      <stop offset="1" stop-color="#06080f"/>
    </radialGradient>
    <linearGradient id="cellFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2c879"/>
      <stop offset="1" stop-color="#b48b5a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- 4×3 = 12 マスのグリッド (3 行目までの 8 マス塗、9 マス目進行中) -->
  <g transform="translate(10 16)">
    <!-- row 0 -->
    <rect x="0"  y="0"  width="9" height="8" rx="1.6" fill="url(#cellFill)"/>
    <rect x="11" y="0"  width="9" height="8" rx="1.6" fill="url(#cellFill)"/>
    <rect x="22" y="0"  width="9" height="8" rx="1.6" fill="url(#cellFill)"/>
    <rect x="33" y="0"  width="9" height="8" rx="1.6" fill="url(#cellFill)"/>
    <!-- row 1 -->
    <rect x="0"  y="10" width="9" height="8" rx="1.6" fill="url(#cellFill)"/>
    <rect x="11" y="10" width="9" height="8" rx="1.6" fill="url(#cellFill)"/>
    <rect x="22" y="10" width="9" height="8" rx="1.6" fill="url(#cellFill)"/>
    <rect x="33" y="10" width="9" height="8" rx="1.6" fill="url(#cellFill)"/>
    <!-- row 2: 0-1 塗り、2 進行中 (発光)、3 未塗 -->
    <rect x="0"  y="20" width="9" height="8" rx="1.6" fill="url(#cellFill)"/>
    <rect x="11" y="20" width="9" height="8" rx="1.6" fill="url(#cellFill)"/>
    <rect x="22" y="20" width="9" height="8" rx="1.6"
          fill="rgba(242,200,121,0.18)" stroke="#fff5d0" stroke-width="0.6"/>
    <rect x="33" y="20" width="9" height="8" rx="1.6" fill="rgba(255,255,255,0.06)"
          stroke="rgba(255,255,255,0.12)" stroke-width="0.5"/>
  </g>
</svg>
